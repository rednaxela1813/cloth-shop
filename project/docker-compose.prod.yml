services:
  web:
    build:
      context: .
    command: >
      gunicorn ital.wsgi:application
      --bind 0.0.0.0:8000
      --workers $${GUNICORN_WORKERS:-3}
      --timeout $${GUNICORN_TIMEOUT:-60}
    environment:
      DJANGO_SETTINGS_MODULE: ital.settings.prod
    env_file:
      - ./.env.prod
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  release:
    build:
      context: .
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput"
    profiles: ["release"]
    environment:
      DJANGO_SETTINGS_MODULE: ital.settings.prod
    env_file:
      - ./.env.prod
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
        
  celery_worker:
    build:
      context: .
    environment:
      DJANGO_SETTINGS_MODULE: ital.settings.dev
    env_file:
      - ./.env
    command: celery -A ital worker -l info
    volumes:
      - .:/app
      - ./media:/app/media
    depends_on:
      - db
      - redis

  celery_beat:
    build:
      context: .
    environment:
      DJANGO_SETTINGS_MODULE: ital.settings.dev
    env_file:
      - ./.env
    command: celery -A ital beat -l info
    volumes:
      - .:/app
      - ./media:/app/media
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine

  db:
    image: postgres:15-alpine
    env_file:
      - ./.env.prod
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
