services:
  web:
    build:
      context: .
    environment:
      DJANGO_SETTINGS_MODULE: ital.settings.dev
    env_file:
      - ./.env
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  tailwind:
    build:
      context: .
    environment:
      DJANGO_SETTINGS_MODULE: ital.settings.dev
    command: python manage.py tailwind start
    volumes:
      - .:/app
    depends_on:
      - web

  celery_worker:
    build:
      context: .
    environment:
      DJANGO_SETTINGS_MODULE: ital.settings.dev
    env_file:
      - ./.env
    command: celery -A ital worker -l info
    volumes:
      - .:/app
      - ./media:/app/media
    depends_on:
      - db
      - redis

  celery_beat:
    build:
      context: .
    environment:
      DJANGO_SETTINGS_MODULE: ital.settings.dev
    env_file:
      - ./.env
    command: celery -A ital beat -l info
    volumes:
      - .:/app
      - ./media:/app/media
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine

  db:
    image: postgres:15-alpine
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
